[project]
name = "veto"
version = "0.1.0"
description = "Release gate for Argo Rollouts canaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kubernetes>=37.0.1",
    "openai>=3.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veto"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
veto = "veto.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
