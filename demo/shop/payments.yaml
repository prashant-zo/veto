apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/name: payments
    spec:
      containers:
        - name: payments
          image: veto-shop:main-a13119d
          command: ["opentelemetry-instrument", "uvicorn", "shop.payments:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: payments
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp_proto_http
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: healthz
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "1000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
