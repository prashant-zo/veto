# an overlay for your own cluster: copy it, then change the urls and the repo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../..
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: veto
        namespace: veto
      spec:
        template:
          spec:
            containers:
              - name: veto
                env:
                  - name: VETO_PROM_URL
                    value: http://prometheus-operated.monitoring.svc:9090
                  - name: VETO_LOKI_URL
                    value: http://loki-gateway.monitoring.svc:80
                  - name: VETO_GITHUB_REPO
                    value: your-org/your-app
