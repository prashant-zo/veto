# one measurement: promote is success, abort is failure, hold or pending is inconclusive,
# so argo continues, aborts, or pauses the rollout for a person.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: veto
spec:
  args:
    - name: namespace
    - name: rollout
  metrics:
    - name: veto
      count: 1
      successCondition: result == "promote"
      failureCondition: result == "abort"
      provider:
        web:
          url: "http://veto.veto.svc:8080/v1/verdict?namespace={{args.namespace}}&rollout={{args.rollout}}"
          timeoutSeconds: 60
          jsonPath: "{$.verdict}"
