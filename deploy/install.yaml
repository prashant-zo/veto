# Source: veto/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veto
  namespace: veto
  labels:
    app.kubernetes.io/name: veto
    app.kubernetes.io/instance: veto
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veto
      app.kubernetes.io/instance: veto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veto
        app.kubernetes.io/instance: veto
    spec:
      serviceAccountName: veto
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: veto
          image: "ghcr.io/prashant-zo/veto:0.1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VETO_PROM_URL
              value: "http://prometheus-server.monitoring.svc:80"
            - name: VETO_LOKI_URL
              value: "http://loki.monitoring.svc:3100"
            - name: VETO_GITHUB_REPO
              value: "your-org/your-app"
            - name: VETO_MODEL_BASE_URL
              value: "https://inference.baseten.co/v1"
            - name: VETO_MODEL_NAME
              value: "meta-models/muse-spark-open-1026"
            - name: VETO_MODEL_TIMEOUT
              value: "60"
            - name: VETO_UI
              value: "true"
            - name: VETO_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veto-model
                  key: VETO_MODEL_API_KEY
            - name: VETO_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veto-model
                  key: VETO_FALLBACK_API_KEY
                  optional: true
            - name: VETO_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veto-model
                  key: VETO_GITHUB_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Source: veto/templates/analysistemplate.yaml
# one measurement: promote is success, abort is failure, hold or pending is inconclusive,
# so argo continues, aborts, or pauses the rollout for a person.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: veto
  labels:
    app.kubernetes.io/name: veto
    app.kubernetes.io/instance: veto
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  args:
    - name: namespace
    - name: rollout
  metrics:
    - name: veto
      count: 1
      successCondition: result == "promote"
      failureCondition: result == "abort"
      provider:
        web:
          url: "http://veto.veto.svc:8080/v1/verdict?namespace={{args.namespace}}&rollout={{args.rollout}}"
          timeoutSeconds: 60
          jsonPath: "{$.verdict}"
