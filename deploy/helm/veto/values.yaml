# Veto, a release gate for Argo Rollouts canaries.
# Everything that is not a secret lives here. Keys live in a Kubernetes secret, see model.existingSecret.

image:
  repository: ghcr.io/prashant-zo/veto
  # empty means the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

# where Veto reads evidence from
evidence:
  prometheusUrl: http://prometheus-server.monitoring.svc:80
  lokiUrl: http://loki.monitoring.svc:3100
  # the repo whose pull requests your image tags point to (tags look like pr-<number>-<sha>)
  githubRepo: ""

model:
  baseUrl: https://inference.baseten.co/v1
  name: meta-models/muse-spark-open-1026
  timeoutSeconds: 60
  # name of a secret you created yourself, with the key VETO_MODEL_API_KEY and, if you use them,
  # VETO_FALLBACK_API_KEY and VETO_GITHUB_TOKEN. The safe choice, and the only one for GitOps.
  existingSecret: ""
  # only for quick tests: the chart creates the secret from these values. Never commit them.
  apiKey: ""
  fallback:
    baseUrl: ""
    name: ""
    apiKey: ""
  githubToken: ""

# the ClusterAnalysisTemplate your rollouts point at in an analysis step
analysisTemplate:
  create: true
  name: veto
  timeoutSeconds: 60

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
