{{- if not .Values.model.existingSecret }}
{{- if not .Values.model.apiKey }}
{{- fail "set model.existingSecret (a secret with VETO_MODEL_API_KEY) or, for a quick test, model.apiKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veto.secret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veto.labels" . | nindent 4 }}
type: Opaque
stringData:
  VETO_MODEL_API_KEY: {{ .Values.model.apiKey | quote }}
  {{- with .Values.model.fallback.apiKey }}
  VETO_FALLBACK_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.model.githubToken }}
  VETO_GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
