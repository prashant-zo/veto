{{- if .Values.rbac.create }}
# read rollouts and pods, write events. nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "veto.fullname" . }}
  labels:
    {{- include "veto.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "veto.fullname" . }}
  labels:
    {{- include "veto.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "veto.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "veto.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
