# publishes the replay page (the veto ui page from src/veto/serve/static) with site/data.json to github pages
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "src/veto/serve/static/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: page and data in one folder
        run: |
          mkdir -p _site
          cp src/veto/serve/static/index.html src/veto/serve/static/icon.svg site/data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
